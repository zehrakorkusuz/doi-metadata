# DOI Benchmark Corpus
# -------------------
# Tiered collection of DOIs for systematic testing of the metadata aggregation pipeline.
#
# Tier 1: Edge cases and unusual DOI types that stress specific fetchers (~38 DOIs)
# Tier 2: Landmark papers across biomedicine, genomics, AI/ML, and data science (~250 DOIs)
# Tier 3: Prolific researchers -- their key DOIs seed the queue, and the author_works
#          expander discovers the rest of their publications via OpenAlex (~50 researchers)
#
# Tiers 4-5 are auto-generated by expander modules (top_cited, author_works, citation_graph)

